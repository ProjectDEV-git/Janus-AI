[project]
name = "janus-ai"
version = "0.1.0"
description = "Janus — a local, autonomous, self-improving agent that runs on Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ollama>=0.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "duckduckgo-search>=6.1.0",
    "trafilatura>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
# Optional: only needed for the LoRA self-improvement layer (requires a GPU).
# Self-training (LoRA on the base Gemma weights). Needs a GPU for real training.
finetune = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.9.0",
    "datasets>=2.18.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.23.0",
]

[project.scripts]
janus = "janus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
