# Janus configuration. Env vars (JANUS_*) override these.

# --- Model ---
# provider: "ollama"    - a local Ollama server (any model you've pulled)
#           "openai"    - any OpenAI-compatible API: OpenAI, OpenRouter, Groq, Together,
#                         Mistral, DeepSeek, Gemini, LM Studio, vLLM, llama.cpp server, ...
#           "anthropic" - Anthropic's API (Claude models)
# For openai/anthropic, put the key in JANUS_API_KEY (or OPENAI_API_KEY /
# ANTHROPIC_API_KEY), not in this file. Examples are in the README.
provider = "ollama"
model = "hf.co/HauhauCS/Gemma-4-E2B-Uncensored-HauhauCS-Aggressive:IQ3_M"
ollama_host = "http://localhost:11434"
# Endpoint for openai/anthropic; "" = the provider's official API.
api_base = ""
temperature = 0.7
# Max tokens the model may generate per call (0 = model default).
num_predict = 0
# Ollama context window. Ollama's default is small enough to silently cut off the
# agent's history; raise it if your model and RAM allow (0 = Ollama default).
num_ctx = 8192

# --- Workspace ---
# Default root for file operations. Paths outside this are "risky" and gated.
workspace = "./janus_workspace"

# --- Budgets (hard caps per task; hitting one pauses and reports) ---
max_iterations = 40
max_seconds = 1800
max_tokens = 200000

# --- Approval policy ---
# auto_approve_safe: run read-only / in-workspace actions without asking.
auto_approve_safe = true
# trust: when true, risky actions also run without a prompt (kill switch + audit log stay on).
trust = false
# Where model-written code (shell, python, benchmark checks) runs:
#   "auto"  - inside a bubblewrap sandbox when available (read-only filesystem except the
#             workspace, home hidden, no network); otherwise code execution needs approval
#   "bwrap" - always sandbox; refuse to run code if bubblewrap is missing
#   "off"   - never sandbox (code execution then needs approval unless trust = true)
sandbox = "auto"

# --- Benchmark (the gate every self-change must pass) ---
bench_temperature = 0.0   # sample deterministically so A/B differences are caused by the change
bench_seed = 0
bench_repeats = 1         # raise to average out remaining variance (costs proportionally more time)
bench_min_gain = 0.05     # at equal success, tokens per task must drop at least 5% to count

# --- Self-training (LoRA on the base Gemma weights; needs a GPU to train) ---
# IMPORTANT: this is the full-precision source to TRAIN from. The IQ3_M GGUF you
# run for inference cannot be trained; set this to the matching base weights.
base_model_id = "google/gemma-3n-E2B"
model_prefix = "janus"          # produced Ollama tags: janus:v1, janus:v2, ...
gguf_quant = "Q4_K_M"           # quantization for the produced GGUF
train_min_examples = 20         # refuse to train on fewer winning transcripts than this
train_epochs = 1
train_lr = 2e-4
train_batch_size = 1
train_grad_accum = 8
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
llama_cpp_dir = ""              # path to a built llama.cpp (for GGUF convert); "" = autodetect
